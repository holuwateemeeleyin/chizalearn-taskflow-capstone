apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: taskflow-postgres-data
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: gp2

  - target:
      version: v1
      kind: Service
      name: taskflow-frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: taskflow-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: timiajiboye/taskflow-backend:0.1.9

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: taskflow-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: timiajiboye/taskflow-frontend:0.1.1
